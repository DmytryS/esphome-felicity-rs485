# Experimental ESPHome bridge: Felicity RS485 → Deye CAN.
# Start with battery data verified in Home Assistant. Set the Deye battery
# protocol to Lithium CAN (Felicity documents Deye CAN mode 00).

esphome:
  name: felicity-deye-bridge
  friendly_name: Felicity to Deye Bridge

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/DmytryS/esphome-felicity-rs485
      ref: main
    components: [felicity_rs485]

uart:
  id: felicity_uart
  tx_pin: GPIO22
  rx_pin: GPIO21
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 256

canbus:
  - platform: esp32_can
    id: deye_can
    tx_pin: GPIO27
    rx_pin: GPIO26
    can_id: 0x000
    bit_rate: 500kbps

felicity_rs485:
  id: felicity_bus
  uart_id: felicity_uart
  direction_pin: GPIO17
  pack_addresses: [1, 2]
  update_interval: 10s
  canbus_id: deye_can
  deye_can_bridge: true

sensor:
  - platform: felicity_rs485
    felicity_rs485_id: felicity_bus
    address: 1
    voltage: {name: "Battery 1 Voltage"}
    current: {name: "Battery 1 Current"}
    soc: {name: "Battery 1 SOC"}
    soh: {name: "Battery 1 SOH"}
    charge_voltage_limit: {name: "Battery 1 Charge Voltage Limit"}
    charge_current_limit: {name: "Battery 1 Charge Current Limit"}
    discharge_voltage_limit: {name: "Battery 1 Discharge Voltage Limit"}
    discharge_current_limit: {name: "Battery 1 Discharge Current Limit"}

  - platform: felicity_rs485
    felicity_rs485_id: felicity_bus
    address: 2
    voltage: {name: "Battery 2 Voltage"}
    current: {name: "Battery 2 Current"}
    soc: {name: "Battery 2 SOC"}
    soh: {name: "Battery 2 SOH"}
    charge_voltage_limit: {name: "Battery 2 Charge Voltage Limit"}
    charge_current_limit: {name: "Battery 2 Charge Current Limit"}
    discharge_voltage_limit: {name: "Battery 2 Discharge Voltage Limit"}
    discharge_current_limit: {name: "Battery 2 Discharge Current Limit"}
