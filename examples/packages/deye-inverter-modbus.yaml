# Deye SUN-6K-SG03LP1 Modbus RTU: telemetry AND inverter settings (read/write),
# via an external RS485 adapter (GPIO16 TX -> DI, RO -> GPIO18; WeAct FPC
# positions 15/16). Included by felicity-deye-bridge-inverter.yaml and merged
# with its config. Do not use GPIO17 here: it is the Felicity direction pin.
# WARNING: the switches/numbers/selects and the hourly time sync WRITE to the
# inverter. Remove those sections for a read-only setup.
# Needs Home Assistant for time sync and the "Sync Time" input_boolean.
# Register map based on the community Deye SUN-6K-SG03LP1 ESPHome config.
# Addresses are decimal on purpose: YAML reads 013 as octal.

uart:
  - id: deye_uart
    tx_pin: GPIO16
    rx_pin: GPIO18
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 256

modbus:
  id: deye_modbus
  uart_id: deye_uart
  send_wait_time: 500ms

modbus_controller:
  - id: deye_inverter
    address: 1
    modbus_id: deye_modbus
    setup_priority: -10
    update_interval: 15s

time:
  - platform: homeassistant
    id: homeassistant_time

# Sync the inverter clock from Home Assistant hourly.
interval:
  - interval: 3600s
    then:
      - lambda: |-
          esphome::modbus_controller::ModbusController *controller = id(deye_inverter);
          time_t now = ::time(nullptr);
          struct tm *time_info = ::localtime(&now);
          int year = time_info->tm_year + 1900;
          if (year != 1970) {
            uint16_t reg22_value = ((year - 2000) << 8) | (time_info->tm_mon + 1);
            uint16_t reg23_value = (time_info->tm_mday << 8) | time_info->tm_hour;
            uint16_t reg24_value = (time_info->tm_min << 8) | time_info->tm_sec;
            std::vector<uint16_t> rtc_data = {reg22_value, reg23_value, reg24_value};
            esphome::modbus_controller::ModbusCommandItem set_rtc_command =
                esphome::modbus_controller::ModbusCommandItem::create_write_multiple_command(controller, 22, rtc_data.size(), rtc_data);
            controller->queue_command(set_rtc_command);
            ESP_LOGI("Time Sync", "Synced inverter RTC: %04d-%02d-%02d %02d:%02d:%02d", year, time_info->tm_mon + 1, time_info->tm_mday, time_info->tm_hour, time_info->tm_min, time_info->tm_sec);
          }

binary_sensor:
  - platform: homeassistant
    entity_id: input_boolean.sync_inverter_time
    name: "Inverter Sync Time"
    id: sync_time
    on_press:
      then:
        - lambda: |-
            esphome::modbus_controller::ModbusController *controller = id(deye_inverter);
            time_t now = ::time(nullptr);
            struct tm *time_info = ::localtime(&now);
            int year = time_info->tm_year + 1900;
            if (year != 1970) {
              uint16_t reg22_value = ((year - 2000) << 8) | (time_info->tm_mon + 1);
              uint16_t reg23_value = (time_info->tm_mday << 8) | time_info->tm_hour;
              uint16_t reg24_value = (time_info->tm_min << 8) | time_info->tm_sec;
              std::vector<uint16_t> rtc_data = {reg22_value, reg23_value, reg24_value};
              esphome::modbus_controller::ModbusCommandItem set_rtc_command =
                  esphome::modbus_controller::ModbusCommandItem::create_write_multiple_command(controller, 22, rtc_data.size(), rtc_data);
              controller->queue_command(set_rtc_command);
              ESP_LOGI("Time Sync", "Synced inverter RTC: %04d-%02d-%02d %02d:%02d:%02d", year, time_info->tm_mon + 1, time_info->tm_mday, time_info->tm_hour, time_info->tm_min, time_info->tm_sec);
            }

  - platform: modbus_controller
    modbus_controller_id: deye_inverter
    name: "Inverter Grid Connected Status"
    id: inverter_esphome_grid_connected_status
    register_type: holding
    address: 194

