text_sensor:
  - platform: modbus_controller
    modbus_controller_id: deye_inverter
    name: "Inverter Overall State"
    id: inverter_esphome_overall_state
    register_type: holding
    skip_updates: 30
    raw_encode: HEXBYTES
    address: 59
    lambda: |-
      if (x.size() != 4) return std::string("unknown");
      switch (modbus_controller::word_from_hex_str(x, 0)) {
        case 0: return std::string("standby");
        case 1: return std::string("selftest");
        case 2: return std::string("normal");
        case 3: return std::string("alarm");
        case 4: return std::string("fault");
        default: return std::string("unknown");
      }

  - platform: template
    name: "Inverter Time Slot 1"
    id: inverter_esphome_time_slot_1
    icon: "mdi:clock"
    update_interval: 15s
    lambda: |-
      const float raw = id(inverter_esphome_system_mode_time1).state;
      if (!std::isfinite(raw) || raw < 0 || raw > 2400) return std::string("unknown");
      const int value = static_cast<int>(raw);
      char formatted_time[6];
      snprintf(formatted_time, sizeof(formatted_time), "%02d:%02d", value / 100, value % 100);
      return std::string(formatted_time);

