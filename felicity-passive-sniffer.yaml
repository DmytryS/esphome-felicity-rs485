esphome:
  name: felicity-passive-sniffer
  friendly_name: Felicity Passive Sniffer
  on_boot:
    priority: -100
    then:
      - output.turn_off: rs485_de

esp32:
  board: esp32dev
  flash_size: 8MB
  framework:
    type: arduino

logger:
  level: VERY_VERBOSE
  baud_rate: 115200

output:
  - platform: gpio
    pin: GPIO17
    id: rs485_de

uart:
  id: bms_uart
  tx_pin: GPIO22
  rx_pin: GPIO21
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 1024
  debug:
    direction: RX
    after:
      timeout: 100ms
    sequence:
      - lambda: UARTDebug::log_hex(direction, bytes, ':');
