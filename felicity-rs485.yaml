esphome:
  name: felicity-modbus-reader
  friendly_name: Felicity Modbus Reader

esp32:
  board: esp32dev
  flash_size: 8MB
  framework:
    type: arduino

logger:
  level: DEBUG
  baud_rate: 115200

external_components:
  - source:
      type: local
      path: components
    components: [felicity_rs485]

uart:
  id: felicity_uart
  tx_pin: GPIO22
  rx_pin: GPIO21
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 256

felicity_rs485:
  id: felicity_bus
  uart_id: felicity_uart
  direction_pin: GPIO17
  pack_addresses: [1, 2]
  update_interval: 30s

sensor:
